item.sword_normal.name=通常の剣
item.sword_normal.description=この剣は、冒険者が最初に手にする武器であり、シンプルながらも信頼性の高い一振りです。鋭い刃とバランスの取れたデザインは、初心者から熟練者まで幅広い戦士に愛用されています。敵を切り裂く力は控えめですが、確実な一撃を与えることができます。この剣を手にすることで、冒険の第一歩を踏み出すことができるでしょう。
item.axe_normal.name=通常の斧
item.axe_normal.description=この斧は、力強い一撃を求める冒険者に最適な武器です。重厚な刃と頑丈な柄は、木を切り倒すだけでなく、敵を一刀両断するために設計されています。初心者から熟練の戦士まで、幅広い層に愛されるこの斧は、戦場での頼もしい相棒となるでしょう。斧を振るうことで、敵に恐怖を与え、勝利を手にすることができます。
item.staff_normal.name=通常の杖
item.staff_normal.description=この杖は、魔法使いや賢者が最初に手にする武器であり、シンプルながらも強力な魔法の力を秘めています。木製の柄とクリスタルの先端は、魔法のエネルギーを集中させ、敵に強力な呪文を放つことができます。初心者から熟練の魔法使いまで、幅広い層に愛されるこの杖は、冒険の旅路で欠かせない存在となるでしょう。
item.bow_normal.name=通常の弓
item.bow_normal.description=この弓は、遠距離攻撃を得意とする冒険者に最適な武器です。軽量で扱いやすいデザインは、素早い射撃を可能にし、敵を遠くから狙い撃つことができます。初心者から熟練の弓使いまで、幅広い層に愛されるこの弓は、静かに敵を排除するための頼もしい相棒となるでしょう。矢を放つことで、戦場での優位性を確保することができます。
item.spear_normal.name=通常の槍
item.spear_normal.description=この槍は、近接戦闘と遠距離攻撃の両方を得意とする冒険者に最適な武器です。長い柄と鋭い先端は、敵を突き刺すだけでなく、遠くの目標を狙うことも可能にします。初心者から熟練の槍使いまで、幅広い層に愛されるこの槍は、戦場での多様な戦術を支える頼もしい相棒となるでしょう。槍を振るうことで、敵に強力な一撃を与えることができます。
item.armor_normal.name=通常の防具
item.armor_normal.description=この防具は、冒険者が最初に身につける防御装備であり、シンプルながらも信頼性の高い一式です。軽量で動きやすく、基本的な防御力を提供します。初心者から熟練の戦士まで、幅広い層に愛用されるこの防具は、冒険の旅路での安全を確保するための頼もしい相棒となるでしょう。敵の攻撃から身を守り、勝利を手にするための第一歩となります。
item.hat_normal.name=通常の帽子
item.hat_normal.description=この帽子は、冒険者が最初に手にする頭部防具であり、シンプルながらも基本的な保護を提供します。軽量で通気性が良く、長時間の冒険でも快適に着用できます。初心者から熟練の冒険者まで、幅広い層に愛用されるこの帽子は、太陽や雨から頭を守り、冒険の旅路での安全を確保するための頼もしい相棒となるでしょう。
item.boots_normal.name=通常のブーツ
item.boots_normal.description=このブーツは、冒険者が最初に履く足元の防具であり、シンプルながらも基本的な保護と快適さを提供します。軽量で歩きやすく、長時間の冒険でも疲れにくいデザインです。初心者から熟練の冒険者まで、幅広い層に愛用されるこのブーツは、険しい地形や長い旅路でも足元を守り、冒険の旅路での安全を確保するための頼もしい相棒となるでしょう。

item.dual_blade_axe.name=双刃戦斧
item.dual_blade_axe.description=戦の神アレスの灼熱の炎で鍛えられた双刃戦斧は、戦場における絶対的な力と血への渇望の象徴だ。一振りすれば空を裂き、敵の心に恐怖を刻む。両端に鋭い刃を持つこの武器は、斬るだけでなく、目の前のすべてをなぎ払うために存在する。この斧を手にするのは、真の勇者のみ。双刃戦斧を掲げた時、流れるのは敵の血か…それとも己の血か。
item.better_armor.name=より良い防具
item.better_armor.description=この防具は、冒険者が次のレベルに進むための強力な防御装備です。高品質な素材で作られ、優れた耐久性と保護力を提供します。敵の攻撃から身を守りつつ、動きやすさも兼ね備えています。初心者から熟練の戦士まで、幅広い層に愛用されるこの防具は、冒険の旅路での安全を確保するための頼もしい相棒となるでしょう。

