item.dual_blade_axe.name=Chiến Phủ Song Nhận
item.dual_blade_axe.description=Được rèn giũa dưới ngọn lửa của thần chiến tranh Ares, Chiến Phủ Song Nhận là biểu tượng của sức mạnh tuyệt đối và sự khát máu trên chiến trường. Mỗi nhát chém tung ra như xé toạc bầu không khí, gieo rắc nỗi kinh hoàng vào tim kẻ địch. Với hai lưỡi rìu sắc bén ở cả hai đầu, thứ vũ khí này không chỉ dùng để chém mà còn để quét sạch mọi thứ trên đường đi. Chỉ những chiến binh quả cảm nhất mới dám cầm nó, bởi khi nâng lên Chiến Phủ Song Nhận, thì máu phải đổ — là của kẻ thù, hoặc của chính ngươi!
item.better_armor.name=Giáp tốt hơn
