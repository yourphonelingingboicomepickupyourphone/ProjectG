item.dual_blade_axe.name=Hacha de Batalla de Doble Hoja
item.dual_blade_axe.description=Forjada en las llamas ardientes del dios de la guerra Ares, la Hacha de Batalla de Doble Hoja es símbolo de poder absoluto y sed de sangre en el campo de batalla. Cada golpe desgarra el aire e infunde terror en los corazones enemigos. Con afiladas hojas en ambos extremos, esta arma no solo corta, sino que arrasa con todo a su paso. Solo los guerreros más valientes se atreven a blandirla, pues cuando se alza la Hacha de Batalla de Doble Hoja, la sangre debe correr — la del enemigo… o la tuya.
