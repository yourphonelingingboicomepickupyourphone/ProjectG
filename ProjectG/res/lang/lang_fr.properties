item.sword_normal.name=Épée Normale
item.sword_normal.description=Une épée forgée par les forgerons les plus habiles, offrant un bon équilibre entre puissance et maniabilité.
item.axe_normal.name=Hache Normale
item.axe_normal.description=Une hache robuste, parfaite pour abattre des ennemis et des obstacles. Sa lame tranchante est capable de fendre les armures les plus résistantes.
item.staff_normal.name=Bâton Normal
item.staff_normal.description=Un bâton simple mais efficace, utilisé par les mages pour canaliser leur magie. Il est léger et facile à manier, idéal pour les sorts de base.
item.bow_normal.name=Arc Normal
item.bow_normal.description=Un arc classique, fabriqué en bois solide. Il est parfait pour les archers débutants, offrant une portée décente et une bonne précision.
item.spear_normal.name=Lance Normale
item.spear_normal.description=Une lance longue et pointue, idéale pour les combats à distance. Sa portée permet de garder les ennemis à distance tout en infligeant des dégâts importants.
item.armor_normal.name=Armure Normale
item.armor_normal.description=Une armure de base qui offre une protection adéquate contre les attaques ennemies. Elle est fabriquée en métal léger, permettant une bonne mobilité tout en protégeant le porteur.
item.hat_normal.name=Chapeau Normal
item.hat_normal.description=Un chapeau simple qui offre une protection minimale contre les
item.boots_normal.name=Bottes Normales
item.boots_normal.description=Des bottes robustes qui offrent un bon soutien et une protection contre les terrains difficiles. Elles sont confortables pour les longues marches et les combats.

item.dual_blade_axe.name=Hache de Guerre à Double Lame
item.dual_blade_axe.description=Forgée dans les flammes ardentes du dieu de la guerre Arès, la Hache de Guerre à Double Lame incarne la puissance absolue et la soif de sang sur le champ de bataille. Chaque coup fend l’air et sème la terreur dans le cœur des ennemis. Dotée de lames acérées aux deux extrémités, cette arme ne sert pas seulement à trancher, mais à balayer tout sur son passage. Seuls les guerriers les plus courageux osent la brandir, car lorsque la Hache de Guerre à Double Lame s’élève, le sang doit couler — celui de l’ennemi… ou le tien.
item.better_armor.name=Armure Supérieure
item.better_armor.description=Une armure forgée par les meilleurs forgerons, offrant une protection supérieure contre les attaques ennemies.

item.mini_mana_potion.name=Potion de Mini Mana
